 width="32" height="26" rx="4"/><path d="M4 15h32"/><circle class="fill" cx="9" cy="11" r="1.2"/><circle class="fill" cx="13.5" cy="11" r="1.2"/></g><rect class="card" x="988.0" y="548.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(1000.0 560.0) scale(1.000)"><rect x="6" y="5" width="28" height="30" rx="3"/><path d="M6 13h28M6 27h28M13 5v30M27 5v30"/></g><rect class="card" x="1358.0" y="268.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(1370.0 280.0) scale(1.000)"><ellipse cx="20" cy="9" rx="13" ry="4.5"/><path d="M7 9v22c0 2.5 5.8 4.5 13 4.5S33 33.500 33 31V9M7 20c0 2.5 5.8 4.500 13 4.500S33 22.500 33 20"/></g><text class="title" x="190" y="302.0">content/foundations</text><text class="sub mono" x="190" y="321.0">章 495 件(Markdown)</text><text class="sub mono" x="190" y="336.0">手順・クイズ・ガイドは frontmatter</text><text class="title" x="190" y="522.0">updates.ts</text><text class="sub mono" x="190" y="541.0">更新履歴(手書きの静的データ)</text><text class="title" x="590" y="272.0">step-scene.ts</text><text class="sub mono" x="590" y="291.0">章の id → 図の型</text><text class="sub mono" x="590" y="306.0">(平面 2 種・立体 6 種)</text><text class="title" x="590" y="452.0">chapter-links・</text><text class="title" x="590" y="471.0">chapter-sections</text><text class="sub mono" x="590" y="488.0">本文のリンクから章の地図</text><text class="sub mono" x="590" y="503.0">本文を解説 / 例に分ける</text><text class="title" x="590" y="632.0">guess・ascii-crystal</text><text class="sub mono" x="590" y="651.0">先に予想・ASCII の結晶</text><text class="sub mono" x="590" y="666.0">(乱数も時刻も使わない)</text><text class="title" x="1020" y="272.0">createContentLoader</text><text class="sub mono" x="1020" y="291.0">メタ・本文 HTML</text><text class="sub mono" x="1020" y="306.0">(gray-matter・marked)</text><text class="title" x="1020" y="452.0">カタログ・章ページ</text><text class="sub mono" x="1020" y="471.0">/foundations/[id]</text><text class="sub mono" x="1020" y="486.0">解説・例・クイズ</text><text class="title" x="1020" y="632.0">手順の図</text><text class="sub mono" x="1020" y="651.0">平面: SVG(FlowScene)</text><text class="sub mono" x="1020" y="666.0">立体: three.js(動的読み込み)</text><text class="title" x="1390" y="352.0">localStorage</text><text class="sub mono" x="1390" y="371.0">復習記録 fe-review-v1</text><text class="sub mono" x="1390" y="386.0">好み fe-scene-view など</text><rect class="lab" x="542.8" y="129.0" width="34.5" height="16" rx="3"/><text class="alabel mono blue" x="560.0" y="141.0">読む</text><rect class="lab" x="786.6" y="299.0" width="46.7" height="16" rx="3"/><text class="alabel mono blue" x="810.0" y="311.0">図の型</text><rect class="lab" x="1194.4" y="339.0" width="71.2" height="16" rx="3"/><text class="alabel mono " x="1230.0" y="351.0">復習を保存</text><text class="hd" x="40" y="44" text-anchor="start">FoundationsEncyclopedia — 構成</text><text class="note" x="40" y="66" text-anchor="start">青=主な流れ / 灰の破線=補助。章は Markdown、図の型は規則表、保存はブラウザの中だけ</text></svg>
